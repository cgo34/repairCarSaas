# Nom du workflow affiché dans GitHub Actions
name: CI Pipeline

# Déclencheurs du workflow
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Variables globales
env:
  DOCKER_IMAGE: 'app:test'
  DEPLOY_ENV: 'dev'

jobs:
  # Job 1: Installation des dépendances
  install_dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

  # Job 2: Vérification Lint & TypeScript
  lint_and_typecheck:
    name: Lint & Type Check
    needs: [install_dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

  # Job 3: Build de l'application
  build:
    name: Build Application
    needs: [lint_and_typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # Sauvegarde du build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Job 4: Déploiement en développement (optionnel)
  deploy_dev:
    name: Deploy to Development
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' # Uniquement sur la branche develop
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # Récupération du build
      - name: Download Build
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist

      # Placeholder pour le déploiement
      - name: Deploy
        id: deploy
        run: |
          echo "Deployment would happen here"
          echo "url=https://dev.example.com" >> $GITHUB_OUTPUT
