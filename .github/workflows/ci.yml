name: CI

# Lint, type-check et build sur chaque push / PR vers main et develop.
# Les deploiements (DEV, PROD) seront ajoutes dans des workflows dedies.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Annule les runs obsoletes d'une meme branche / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint_and_typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  build:
    name: Build
    needs: lint_and_typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package release candidate
        run: bash scripts/package-artifact.sh dist release-candidate

      - name: Verify runtime config injection keeps the artifact intact
        env:
          APP_ENV: ci
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: |
          mkdir work
          tar -xzf release-candidate/dist.tar.gz -C work
          bash scripts/generate-runtime-config.sh work
          jq -e '.environment == "ci" and .supabase.url == "https://example.supabase.co"' work/config.json
          bash scripts/verify-artifact.sh work release-candidate/manifest.json
          (cd release-candidate && sha256sum -c dist.tar.gz.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-candidate/
          retention-days: 7
          if-no-files-found: error

  database:
    name: Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.92.1
      - name: Start local Supabase
        run: supabase start -x edge-runtime,imgproxy,logflare,vector,studio,mailpit
      - name: Replay migrations and seed
        run: supabase db reset
      - name: Run pgTAP tests
        run: supabase test db
