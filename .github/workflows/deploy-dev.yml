name: Deploy DEV

# Deploie sur DEV l'artefact candidat produit par la CI apres un push sur develop.
# Aucun rebuild : on telecharge, verifie, injecte config.json DEV puis on publie.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID du run CI (push sur develop) dont l'artefact release-candidate doit etre deploye"
        required: true

permissions:
  contents: read
  actions: read

# Un seul deploiement DEV a la fois, sans interrompre celui en cours.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  WRANGLER_VERSION: 4.169.0

jobs:
  deploy:
    name: Deploy to DEV
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-candidate
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify release candidate
        run: |
          (cd release-candidate && sha256sum -c dist.tar.gz.sha256)
          mkdir site
          tar -xzf release-candidate/dist.tar.gz -C site
          bash scripts/verify-artifact.sh site release-candidate/manifest.json
          test "$(jq -r .commit release-candidate/manifest.json)" = "$SOURCE_SHA"

      - name: Generate DEV runtime config
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: bash scripts/generate-runtime-config.sh site && bash scripts/apply-noindex.sh site

      - name: Deploy to Cloudflare Pages (branch develop)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: >-
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy site
          --project-name="$CLOUDFLARE_PROJECT_NAME"
          --branch=develop
          --commit-hash="$SOURCE_SHA"
          --commit-dirty=true

      - name: Smoke test
        env:
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          base="https://develop.${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$base/" -o /dev/null \
              && curl -fsS "$base/config.json" | jq -e --arg env "$APP_ENV" '.environment == $env and (.supabase.url | startswith("https://"))' > /dev/null; then
              echo "Smoke test OK on $base"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "Smoke test failed on $base" >&2
          exit 1
